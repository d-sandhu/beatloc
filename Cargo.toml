[package]
name = "beatloc"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"  # rten 0.24 MSRV
description = "Convert audio into a machine-readable musical timeline (JSON) for video-making agents"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
realfft = "3"
rten = { version = "0.24.0", features = ["fft"] }
rten-tensor = "0.24.0"
rubato = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6", default-features = false, features = [
    "aac",
    "flac",
    "isomp4",
    "mp3",
    "ogg",
    "opt-simd",
    "pcm",
    "vorbis",
    "wav",
] }
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
