[package]
name = "beatloc"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Convert audio into a machine-readable musical timeline (JSON) for video-making agents"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
realfft = "3"
rubato = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6", default-features = false, features = [
    "flac",
    "mp3",
    "opt-simd",
    "pcm",
    "wav",
] }
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
